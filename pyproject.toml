[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "kaznlp-toolkit"
version = "0.1.0"
description = "Preprocessing and evaluation tools for Kazakh-language sentiment and risk classification"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Temirkhan Bayassov", email = "temupxan@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
keywords = ["nlp", "kazakh", "sentiment", "text-preprocessing", "minhash"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
baseline = ["scikit-learn>=1.3"]
dev = ["scikit-learn>=1.3", "pytest>=8", "pytest-cov>=5", "ruff==0.16.10", "build>=1.2"]

[project.scripts]
kaznlp = "kaznlp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kaznlp"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/data", "/README.md", "/LICENSE", "/CHANGELOG.md", "/CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["kaznlp"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
