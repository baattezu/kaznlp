# Jenkins Configuration as Code: the whole server is described here, so it can be
# deleted and recreated with `docker compose up` without clicking through the UI.
jenkins:
  systemMessage: "kaznlp-toolkit CI/CD (Assignment 5). Configured by casc.yaml."
  numExecutors: 2
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD:-admin}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: true   # read-only dashboard for a local demo; builds need login

credentials:
  system:
    domainCredentials:
      - credentials:
          # kubeconfig for the Minikube cluster (generated by jenkins/make-kubeconfig.sh)
          - file:
              scope: GLOBAL
              id: "minikube-kubeconfig"
              description: "kubeconfig for Minikube"
              fileName: "kubeconfig"
              secretBytes: "${readFileBase64:/run/secrets/kubeconfig}"
          # optional: Docker Hub token; the Push stage is skipped while it is empty
          - usernamePassword:
              scope: GLOBAL
              id: "dockerhub"
              description: "Docker Hub (optional)"
              username: "${DOCKERHUB_USER:-}"
              password: "${DOCKERHUB_TOKEN:-}"

unclassified:
  location:
    url: "${JENKINS_URL:-http://localhost:8080/}"
  timestamper:
    allPipelines: true

jobs:
  - script: >
      pipelineJob('kaznlp-toolkit') {
        description('Lint, unit tests, Docker image, smoke test, deploy to Minikube')
        properties {
          pipelineTriggers {
            triggers {
              pollSCM { scmpoll_spec('* * * * *') }
            }
          }
        }
        definition {
          cpsScm {
            scm {
              git {
                remote { url('${REPO_URL:-file:///repo}') }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(false)
          }
        }
      }
