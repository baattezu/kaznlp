apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaznlp
  namespace: kaznlp
  labels: {app: kaznlp}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app: kaznlp}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}   # zero-downtime update
  template:
    metadata:
      labels: {app: kaznlp}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: kaznlp
          # the tag is replaced by Jenkins (kubectl set image) with <build>-<commit>
          image: kaznlp:latest
          imagePullPolicy: Never          # image is loaded into Minikube by the pipeline
          args: ["serve", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - {name: http, containerPort: 8000}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
