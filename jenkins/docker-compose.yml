# Local Jenkins for the kaznlp pipeline.
#   ./make-kubeconfig.sh            # once, after `minikube start`
#   docker compose up -d --build    # Jenkins on http://localhost:8080 (admin/admin)
name: kaznlp-ci

services:
  jenkins:
    build:
      context: .
      args:
        JENKINS_IMAGE: ${JENKINS_IMAGE:-jenkins/jenkins:lts-jdk21}
    image: kaznlp-ci-jenkins
    container_name: kaznlp-jenkins
    ports:
      - "${JENKINS_PORT:-8080}:8080"
    environment:
      REPO_URL: ${REPO_URL:-file:///repo}
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-admin}
      DOCKERHUB_USER: ${DOCKERHUB_USER:-}
      DOCKERHUB_TOKEN: ${DOCKERHUB_TOKEN:-}
    # the jenkins user may use the host Docker daemon (socket is owned by group root)
    group_add:
      - "0"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/repo:ro                                  # local clone, polled for new commits
      - ./secrets/kubeconfig:/run/secrets/kubeconfig:ro
    networks: [ci, minikube]
    restart: unless-stopped

volumes:
  jenkins_home:

networks:
  ci:
    name: kaznlp-ci
  minikube:
    external: true      # created by `minikube start --driver=docker`
